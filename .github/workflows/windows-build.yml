name: Windows build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Also attach the zip to the release with this tag, for example v1.0.0 (a draft works too). Leave empty to only build and test.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Builds the release, then runs the static checks, the app logic unit tests and the driver
      # harness (standalone and behind a calibrator-style hook), and zips build\dist for download.
      # Fails on the first failure, so only a fully tested build is ever packaged.
      - name: Build, test and package
        shell: pwsh
        run: tools/build.ps1 -Test -Package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: VRControllerFreeze-Windows-x64
          path: build/VRControllerFreeze-*-win-x64.zip
          if-no-files-found: error

  # Attaches the tested zip to a GitHub Release: automatically when one is published, or by hand
  # (Run workflow, with a release tag) to add it to a draft before publishing. Only this job can
  # write to the repository.
  attach:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: VRControllerFreeze-Windows-x64

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          # The zip is named after the version in CMakeLists.txt, so a tag that does not match
          # it (v1.0.0 for 1.0.0) stops here rather than attaching the wrong version.
          zip="VRControllerFreeze-${TAG#v}-win-x64.zip"
          if [ ! -f "$zip" ]; then
            echo "::error::$zip was not built: the release tag $TAG does not match the version in CMakeLists.txt."
            ls -l
            exit 1
          fi
          gh release upload "$TAG" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
